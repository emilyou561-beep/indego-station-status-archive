name: collect station status

# GitHub's cron trigger is unreliable for new repos (it skipped every run for
# the first several hours here), so each run loops for ~5.5 hours, taking a
# snapshot every 15 minutes, then starts the next run itself. The cron entry is
# a backup in case the chain ever breaks.

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect every 15 minutes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 330 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            python collect.py || echo "fetch failed, will retry next round"
            git add data
            if ! git diff --cached --quiet; then
              git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
              git pull -q --rebase && git push -q || echo "push failed, will retry next round"
            fi
            # wait until the next quarter hour
            now=$(date +%s)
            sleep $(( 900 - now % 900 ))
          done

      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref main
